<span class="font-label-caps text-label-caps text-secondary ml-2 px-2 py-1 bg-white/50 rounded-full backdrop-blur-sm border border-border-subtle">Medical AI</span>
</div>
<!-- Value Proposition / Large Text -->
<div class="relative z-10 max-w-lg mb-24">
<h1 class="font-display-lg text-display-lg text-on-surface mb-6">
                临床级精准<br/>
                充满关怀的智能
            </h1>
<p class="font-body-lg text-body-lg text-secondary">
                您的专业医疗AI助手，旨在将高端临床见解与直观便捷的家庭应用无缝结合。
            </p>
</div>
</div>

<div class="w-full md:w-1/2 h-full flex flex-col items-center justify-center relative p-6 md:p-12 lg:p-24 bg-surface-bright">
<!-- Mobile Header (Visible only on mobile) -->
<div class="md:hidden flex flex-col items-center gap-2 mb-12 w-full text-center">
<div class="flex items-center gap-2 justify-center">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'FILL' 1;">vital_signs</span>
<span class="font-headline-md text-headline-md font-bold text-primary">康伴</span>
</div>
<p class="font-body-sm text-body-sm text-secondary">Medical AI</p>
</div>
<!-- Form Container -->
<div class="w-full max-w-[420px] flex flex-col gap-8 z-10 relative">
<div class="flex flex-col gap-2">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">欢迎登录</h2>
<p class="font-body-md text-body-md text-secondary">请输入您的信息以访问您的健康数据</p>
</div>
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Phone/Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary" for="account">手机号或邮箱</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-secondary pointer-events-none">person</span>
<input class="w-full bg-surface-gray border border-border-subtle rounded-xl py-4 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-text-muted outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm" id="account" placeholder="请输入手机号或邮箱" type="text"/>
</div>
</div>
<!-- Verification Code Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-secondary" for="password">密码</label>
<a class="font-body-sm text-body-sm text-primary font-medium hover:underline transition-all" href="#">忘记密码？</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-secondary pointer-events-none">lock</span>
<input class="w-full bg-surface-gray border border-border-subtle rounded-xl py-4 pl-12 pr-12 font-body-md text-body-md text-on-surface placeholder:text-text-muted outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm" id="password" placeholder="请输入密码" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-secondary hover:text-primary transition-colors" onclick="const input = document.getElementById('password'); const icon = this.querySelector('.material-symbols-outlined'); if (input.type === 'password') { input.type = 'text'; icon.textContent = 'visibility'; } else { input.type = 'password'; icon.textContent = 'visibility_off'; }" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>

<div class="flex flex-col gap-4 mt-4">
<button class="w-full bg-primary text-on-primary rounded-full py-4 font-headline-md text-body-lg font-bold shadow-[0_8px_20px_rgba(188,0,10,0.2)] hover:shadow-[0_4px_12px_rgba(188,0,10,0.3)] hover:-translate-y-[1px] transition-all active:translate-y-0" type="submit">
