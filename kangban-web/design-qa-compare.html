<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>账户页面视觉对照</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; color: #161a2c; background: #f2f3f8; font: 14px Inter, sans-serif; }
      h1 { margin: 0 0 24px; }
      section { margin: 0 0 32px; padding: 18px; border-radius: 18px; background: #fff; box-shadow: 0 8px 24px rgba(20, 28, 52, .06); }
      h2 { margin: 0 0 14px; font-size: 18px; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      figure { margin: 0; min-width: 0; }
      figcaption { margin: 0 0 8px; color: #5b6072; font-weight: 700; }
      img { display: block; width: 100%; border: 1px solid #e4e5ec; }
    </style>
  </head>
  <body>
    <h1>Stitch 原图与实现对照</h1>
    <section><h2>家庭成员</h2><div class="pair"><figure><figcaption>Stitch 原图</figcaption><img src="/stitch/PRD-Based-UI-Prototypes/family-members/reference.jpg" alt="家庭成员 Stitch 原图" /></figure><figure><figcaption>当前实现</figcaption><img src="/qa-captures/family-implementation.png" alt="家庭成员当前实现" /></figure></div></section>
    <section><h2>个人资料</h2><div class="pair"><figure><figcaption>Stitch 原图</figcaption><img src="/stitch/PRD-Based-UI-Prototypes/profile/reference.jpg" alt="个人资料 Stitch 原图" /></figure><figure><figcaption>当前实现</figcaption><img src="/qa-captures/profile-implementation.png" alt="个人资料当前实现" /></figure></div></section>
    <section><h2>设置</h2><div class="pair"><figure><figcaption>Stitch 原图</figcaption><img src="/stitch/PRD-Based-UI-Prototypes/settings/reference.jpg" alt="设置 Stitch 原图" /></figure><figure><figcaption>当前实现</figcaption><img src="/qa-captures/settings-implementation.png" alt="设置当前实现" /></figure></div></section>
  </body>
</html>
