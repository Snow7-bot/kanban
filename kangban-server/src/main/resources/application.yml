server:
  port: 8080

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  ai:
    # Real provider is opt-in so local development and tests never make paid calls.
    provider: ${APP_AI_PROVIDER:mock}
    api-url: ${APP_AI_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    api-key: ${APP_AI_API_KEY:}
    ai-model: ${APP_AI_AI_MODEL:qwen3.7-plus-2026-05-26}
    ocr-model: ${APP_AI_OCR_MODEL:qwen3.5-ocr}
    connect-timeout: ${APP_AI_CONNECT_TIMEOUT:10000}
    read-timeout: ${APP_AI_READ_TIMEOUT:60000}

spring:
  application:
    name: kangban-server
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

minio:
  endpoint: ${KANGBAN_MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${KANGBAN_MINIO_ACCESS_KEY}
  secret-key: ${KANGBAN_MINIO_SECRET_KEY}
  bucket: ${KANGBAN_MINIO_BUCKET:kangban-files}

jwt:
  secret: ${KANGBAN_JWT_SECRET}
  expiration: ${KANGBAN_JWT_EXPIRATION:86400000}
  refresh-expiration: ${KANGBAN_JWT_REFRESH_EXPIRATION:604800000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
