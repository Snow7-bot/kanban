spring:
  datasource:
    url: jdbc:mysql://localhost:3306/kangban?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&createDatabaseIfNotExist=true
    username: ${KANGBAN_DB_USERNAME:root}
    password: ${KANGBAN_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: ${KANGBAN_REDIS_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

minio:
  endpoint: ${KANGBAN_MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${KANGBAN_MINIO_ACCESS_KEY}
  secret-key: ${KANGBAN_MINIO_SECRET_KEY}
  bucket: kangban-files

jwt:
  secret: ${KANGBAN_JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    com.kangban: INFO
