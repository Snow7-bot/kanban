server:
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${KANGBAN_DB_URL}
    username: ${KANGBAN_DB_USERNAME}
    password: ${KANGBAN_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${KANGBAN_REDIS_HOST}
      port: ${KANGBAN_REDIS_PORT:6379}
      password: ${KANGBAN_REDIS_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 30s

app:
  base-url: ${APP_BASE_URL}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  captcha:
    secret: ${KANGBAN_CAPTCHA_SECRET}
  ai:
    provider: ${APP_AI_PROVIDER}
    api-url: ${APP_AI_API_URL}
    api-key: ${APP_AI_API_KEY}
    ai-model: ${APP_AI_AI_MODEL}
    ocr-model: ${APP_AI_OCR_MODEL}
    connect-timeout: ${APP_AI_CONNECT_TIMEOUT:10000}
    read-timeout: ${APP_AI_READ_TIMEOUT:120000}
  agent:
    enabled: ${APP_AGENT_ENABLED:true}
    model-tool-calling-enabled: ${APP_AGENT_MODEL_TOOL_CALLING_ENABLED:false}
    context-ttl-seconds: ${APP_AGENT_CONTEXT_TTL_SECONDS:300}
    max-iterations: ${APP_AGENT_MAX_ITERATIONS:5}
    max-history-messages: ${APP_AGENT_MAX_HISTORY_MESSAGES:12}
    max-history-tokens: ${APP_AGENT_MAX_HISTORY_TOKENS:6000}
    max-history-message-characters: ${APP_AGENT_MAX_HISTORY_MESSAGE_CHARACTERS:4000}
    core-pool-size: ${APP_AGENT_CORE_POOL_SIZE:4}
    max-pool-size: ${APP_AGENT_MAX_POOL_SIZE:8}
    queue-capacity: ${APP_AGENT_QUEUE_CAPACITY:40}
    context-secret: ${APP_AGENT_CONTEXT_SECRET}
    rag:
      enabled: ${APP_RAG_ENABLED:false}
      private-enabled: ${APP_RAG_PRIVATE_ENABLED:true}
      vector-store: ${APP_RAG_VECTOR_STORE:mysql-jdbc}
      top-k: ${APP_RAG_TOP_K:5}
      min-score: ${APP_RAG_MIN_SCORE:0.7}
      max-context-tokens: ${APP_RAG_MAX_CONTEXT_TOKENS:6000}
      admin-token: ${APP_KNOWLEDGE_ADMIN_TOKEN:}
      embedding-provider: ${APP_RAG_EMBEDDING_PROVIDER:local}
      embedding-api-url: ${APP_RAG_EMBEDDING_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings}
      embedding-model: ${APP_RAG_EMBEDDING_MODEL:local-hash-v1}
      embedding-dimensions: ${APP_RAG_EMBEDDING_DIMENSIONS:1024}
      embedding-batch-size: ${APP_RAG_EMBEDDING_BATCH_SIZE:16}
      max-file-bytes: ${APP_RAG_MAX_FILE_BYTES:10485760}

minio:
  endpoint: ${KANGBAN_MINIO_ENDPOINT}
  access-key: ${KANGBAN_MINIO_ACCESS_KEY}
  secret-key: ${KANGBAN_MINIO_SECRET_KEY}
  bucket: ${KANGBAN_MINIO_BUCKET}

jwt:
  secret: ${KANGBAN_JWT_SECRET}
  expiration: ${KANGBAN_JWT_EXPIRATION:86400000}
  refresh-expiration: ${KANGBAN_JWT_REFRESH_EXPIRATION:604800000}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.kangban: INFO
    org.springframework.security: WARN
